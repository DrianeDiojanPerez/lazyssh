[package]
name = "lazyssh"
version = "0.0.4"
edition = "2021"
description = "A TUI SSH manager that reads/edits ~/.ssh/config directly"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = "0.4"
portable-pty = "0.9.0"
vt100 = "0.16.2"
