    <text x="92" y="216" font-weight="500" font-size="23" letter-spacing="-0.3" fill="#6e6e73">Your SSH hosts in a terminal, one tab each.</text>
    <text x="92" y="262" font-weight="500" font-size="19" fill="#86868b">Reads and edits ~/.ssh/config. Shows who is up.</text>
